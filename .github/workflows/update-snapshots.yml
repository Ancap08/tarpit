name: Update screenshot baselines

# Run by hand (Actions tab, or `gh workflow run update-snapshots.yml -f ref=<branch>`).
# Regenerates e2e/__screenshots__ on Linux, the platform CI compares on, and
# commits any changed PNGs back to the branch. Kyle approves the PNGs in the PR.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate baselines on and push back to
        required: true
        type: string
      all:
        description: Rewrite every baseline, not only those that differ beyond the pixel threshold
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # visual.spec.ts runs in the desktop project, visual-tablet.spec.ts in the tablet one,
      # visual-phone.spec.ts (milestone 32b) in the phone one.
      - run: npx playwright test e2e/visual.spec.ts e2e/visual-tablet.spec.ts e2e/visual-phone.spec.ts --update-snapshots=${{ inputs.all && 'all' || 'changed' }}
        env:
          CI: '1'
      # Milestone 41b: the campaign screens keep their screenshot case beside their
      # other cases, so it is picked out by name here.
      - run: npx playwright test e2e/campaign-screens.spec.ts e2e/campaign-screens-phone.spec.ts -g "campaign screen screenshots" --update-snapshots=${{ inputs.all && 'all' || 'changed' }}
        env:
          CI: '1'
      - name: Commit changed baselines
        env:
          REF: ${{ inputs.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$(git status --porcelain e2e/__screenshots__)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add e2e/__screenshots__
            git commit -m "Update screenshot baselines from CI run $RUN_ID"
            git push origin "HEAD:$REF"
          else
            echo "Baselines unchanged."
          fi
