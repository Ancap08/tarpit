<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tarpit</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111418;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The "turn your device" card (src/game/portrait.ts shows it in portrait). */
      #rotate-card {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #111418;
        color: #e8dcc0;
        font: bold 26px system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        touch-action: none;
      }
      #rotate-card[hidden] {
        display: none;
      }
      /* Rotate icon: an upright phone outline with a curved arrow turning it right. */
      #rotate-card .icon {
        position: relative;
        width: 120px;
        height: 100px;
      }
      #rotate-card .phone {
        position: absolute;
        left: 22px;
        top: 12px;
        width: 46px;
        height: 80px;
        border: 5px solid #e8dcc0;
        border-radius: 9px;
        box-sizing: border-box;
      }
      #rotate-card .arrow {
        position: absolute;
        left: 70px;
        top: 4px;
        width: 44px;
        height: 44px;
        border: 5px solid #d9b77e;
        border-color: #d9b77e #d9b77e transparent transparent;
        border-radius: 50%;
        box-sizing: border-box;
        transform: rotate(10deg);
      }
      #rotate-card .arrow::after {
        content: '';
        position: absolute;
        right: -10px;
        bottom: -6px;
        border: 8px solid transparent;
        border-top: 11px solid #d9b77e;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-card" hidden>
      <div class="icon" aria-hidden="true"><div class="phone"></div><div class="arrow"></div></div>
      <div>Turn your device sideways</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
