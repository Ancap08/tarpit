<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tarpit</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/LibreCaslonText-Regular-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/LibreCaslonText-Bold-latin.woff2" />
    <!-- Install to the home screen (milestone 32a): public/manifest.webmanifest, public/icons/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111418" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tarpit" />
    <style>
      /* Milestone 35 (pageLock.ts): the page cannot zoom, scroll or drift.
         html and body are fixed and clipped, so the document has nothing to
         scroll; touch-action: none on everything means a pinch, a double tap
         or a pan does nothing wherever a finger starts (the side bars too). */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* No rubber-band bounce or pull-to-refresh in standalone mode. */
        overscroll-behavior: none;
        background: #f1dfb5;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #352216;
        font: 20px Georgia, serif;
        pointer-events: none;
      }
      html,
      body,
      #game,
      #game * {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* The canvas parent stays inside the safe area (notch, home bar);
         viewport-fit=cover lets the page background fill the rest. Phaser's
         FIT scale sizes the canvas to this box. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status">%LOADING_TEXT%</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
