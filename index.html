<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tarpit</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/LibreCaslonText-Regular-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/LibreCaslonText-Bold-latin.woff2" />
    <!-- Install to the home screen (milestone 32a): public/manifest.webmanifest, public/icons/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111418" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tarpit" />
    <style>
      /* Milestone 35 (pageLock.ts): the page cannot zoom, scroll or drift.
         html and body are fixed and clipped, so the document has nothing to
         scroll; touch-action: none on everything means a pinch, a double tap
         or a pan does nothing wherever a finger starts (the side bars too). */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* No rubber-band bounce or pull-to-refresh in standalone mode. */
        overscroll-behavior: none;
        background: #f1dfb5;
      }
      .pause-action, .repair-action {
        position: fixed;
        pointer-events: none;
        background: transparent;
        border: 0;
        color: transparent;
      }
      .pause-action:focus-visible, .repair-action:focus-visible { outline: 2px solid white; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #352216;
        font: 20px Georgia, serif;
        pointer-events: none;
      }
      #keep-status:not([hidden]) {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(0deg, #382318 0 38px, #2b1b14 40px 42px);
        color: #352216;
        font: bold 18px Georgia, serif;
      }
      #keep-status > div {
        box-sizing: border-box;
        width: min(340px, 90vw);
        padding: 20px 16px;
        text-align: center;
        background: #f1dfb5;
        border: 5px double #b68a48;
        box-shadow: 0 6px 18px #16100c;
      }
      #keep-status p { margin: 0 0 16px; }
      #keep-status progress { width: 86%; accent-color: #254a57; }
      #keep-status button {
        min-height: 44px;
        padding: 8px 18px;
        background: #422919;
        border: 2px solid #b68a48;
        color: #f1dfb5;
        font: inherit;
        cursor: pointer;
      }
      [data-paper-ui] #loading,
      [data-paper-ui] #keep-status:not([hidden]) {
        z-index: 2;
        background: #eee7d5;
        color: #242b24;
        font: 18px "Libre Caslon Text", Georgia, serif;
      }
      [data-paper-ui] #loading > span,
      [data-paper-ui] #keep-status > div {
        box-sizing: border-box;
        width: min(365px, calc(100vw - 32px));
        padding: 28px 20px;
        border: 1px solid #c5af92;
        border-radius: 12px;
        background: #fff9eb;
        text-align: center;
        box-shadow: 0 6px 16px #30271a16;
      }
      [data-paper-ui] #loading > span::before {
        content: "";
        display: block;
        width: 34px;
        height: 3px;
        border-radius: 2px;
        margin: 0 auto 16px;
        background: #953c34;
      }
      [data-paper-ui] #keep-status p { margin: 0 0 16px; }
      [data-paper-ui] #keep-status progress {
        width: 100%;
        accent-color: #234b40;
      }
      [data-paper-ui] #keep-status button {
        min-height: 46px;
        width: 100%;
        padding: 11px;
        background: #234b40;
        border: 1px solid #234b40;
        border-radius: 8px;
        color: #fff9eb;
      }
      [data-paper-ui] #keep-status button:focus-visible { outline: 2px solid #953c34; outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        [data-paper-ui="motion"] #loading > span,
        [data-paper-ui="motion"] #keep-status:not([hidden]) > div {
          animation: lay-sheet 220ms cubic-bezier(.2,.65,.3,1) both;
        }
      }
      @keyframes lay-sheet {
        from { transform: translateY(7px); }
        to { transform: translateY(0); }
      }
      html,
      body,
      #game,
      #game * {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* The canvas parent stays inside the safe area (notch, home bar);
         viewport-fit=cover lets the page background fill the rest. Phaser's
         FIT scale sizes the canvas to this box. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status"><span>%LOADING_TEXT%</span></div>
    <div id="game"></div>
    <section id="keep-status" data-failure="%KEEP_FAILED_TEXT%" data-limit="%KEEP_LOAD_LIMIT_MS%" hidden>
      <div>
        <p role="status">%KEEP_LOADING_TEXT%</p>
        <progress aria-label="%KEEP_LOADING_TEXT%" value="0" max="1"></progress>
        <button type="button" hidden>%KEEP_BACK_TEXT%</button>
      </div>
    </section>
    <script>
      const query = new URLSearchParams(location.search);
      if (query.get('ui') === 'new') document.documentElement.dataset.paperUi = query.get('test') === '1' ? 'still' : 'motion';
      if (query.get('keep') === '1') {
        document.getElementById('loading').remove();
        const panel = document.getElementById('keep-status');
        panel.hidden = false;
        panel.setAttribute('data-booting', '');
        setTimeout(() => {
          if (!panel.hasAttribute('data-booting')) return;
          panel.querySelector('p').textContent = panel.dataset.failure;
          panel.querySelector('progress').hidden = true;
          const back = panel.querySelector('button');
          back.hidden = false;
          back.onclick = () => {
            const title = new URL(location.href);
            title.searchParams.delete('keep');
            location.replace(title);
          };
          back.focus();
        }, Math.max(0, Number(panel.dataset.limit) - performance.now()));
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
